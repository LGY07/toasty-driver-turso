[package]
name = "toasty-driver-turso"
version = "0.11.0"
description = "Turso (SQLite-compatible) driver for Toasty"
authors = ["Carl Lerche <me@carllerche.com>"]
edition = "2024"
keywords = ["orm", "database", "sql", "nosql", "async"]
license = "MIT"
repository = "https://github.com/tokio-rs/toasty"
rust-version = "1.95"
categories = ["database"]
documentation = "https://docs.rs/toasty-driver-turso"

[features]
default = []
mimalloc = ["turso/mimalloc"]
fts = ["turso/fts"]
sync = ["turso/sync"]
serverless = ["dep:turso_serverless"]
rust_decimal = ["toasty-core/rust_decimal", "toasty-sql/rust_decimal"]
bigdecimal = ["toasty-core/bigdecimal", "toasty-sql/bigdecimal"]
jiff = ["toasty-core/jiff", "toasty-sql/jiff"]
net = ["toasty-core/net", "toasty-sql/net"]

[dependencies]
async-trait = "0.1"
toasty-core = "0.11"
toasty-sql = "0.11"
tokio = { version = "1.50", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
turso = { version = "0.8", default-features = false }
turso_core = "0.8"
turso_serverless = { version = "0.1", optional = true }

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.149"

[lints.rust]
unsafe_code = "deny"

[workspace]
